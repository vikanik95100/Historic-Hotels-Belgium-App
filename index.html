<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historic Hotels Belgium Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gr:#31402E;--deep:#222d20;--brick:#A54545;--gold:#85714D;--greige:#B5B0A1;--cream:#EFEADC;--bg:#F6F2E6;--paper:#FFFDF7;--ink:#3D3D3D;--mut:rgba(61,61,61,.62);--line:rgba(133,113,77,.28);--c:"Montserrat",system-ui,sans-serif;--f:"Playfair Display",Georgia,serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#E6DFCB;color:var(--ink);overflow:hidden}
.big,.hd,.h2,.tl,.stepper b,.kv,.tick{font-variant-numeric:lining-nums}
.big,.hd,.h2,.stepper b,[style*="var(--f)"]{font-feature-settings:"lnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--gr);color:#fff}
.top img{height:40px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.65)}
.sp{flex:1}
.tag{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--brick);color:#fff;border-color:var(--brick);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--gr)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(133,113,77,.22);background:#EFE9D6}
.rg{margin-bottom:20px}.rg .eb{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15px;font-weight:500;color:#48503f}
.ri .n{font-size:12px;color:#a39a88;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(49,64,46,.07)}
.ri[aria-current=true]{background:var(--gr);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.6)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFBEE,#E4DBC2)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #1b2419,0 0 0 11.5px var(--greige),0 60px 90px -25px rgba(34,45,32,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.screen:after{content:"";position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.06;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .1 0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6f6858}
.hint button{border:1.5px solid var(--gr);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff;color:var(--gr)}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(133,113,77,.22);background:#EFE9D6}
.notes .eb{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brick);font-weight:700}
.notes h2{font-family:var(--f);font-weight:600;font-size:34px;margin:6px 0 8px;line-height:1.02}
.notes p.l{font-size:14.5px;line-height:1.6;color:#575041}
.notes ul{margin:14px 0 0 18px;font-size:14px;line-height:1.55;color:#2c2a22}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--gold);box-shadow:3px 3px 0 var(--greige)}
.why p{font-size:14px;line-height:1.55;margin-top:4px}
.foot{font-size:12px;line-height:1.55;color:#8d8576;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;flex:none}
.island b{font-size:15.5px;font-weight:700;display:block}.island span.s{font-size:12.5px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-size:25px;font-weight:600;color:#e7d9b8}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--gr);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hd{font-family:var(--f);font-weight:600;line-height:1;letter-spacing:-.01em}
.hd em{font-style:italic;font-weight:500}
.hg{color:var(--brick)}
.h2{font-family:var(--f);font-weight:600;font-size:28px;line-height:1.05}
.h3{font-weight:700;font-size:15.5px;line-height:1.25}
.m{font-size:13px;color:var(--mut);line-height:1.5}
.p{font-size:15px;line-height:1.6}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--brick);color:#fff;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.g{background:var(--gr)}.stk.w{background:rgba(255,255,255,.92);color:var(--gr)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--greige)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.gold{background:var(--gold)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(34,45,32,.5)}
.ph{background-size:cover;background-position:center;background-color:#cdc3a8;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,32,23,.42) 0%,rgba(25,32,23,0) 34%,rgba(25,32,23,.14) 55%,rgba(25,32,23,.9) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:54px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;transition:transform .15s;background:var(--brick);color:#fff}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--gr)}.btn.w{background:#fff;color:var(--gr)}.btn.o{background:transparent;color:var(--gr);box-shadow:inset 0 0 0 1.5px var(--greige)}.btn.sm{height:44px;font-size:11.5px}.btn.cr{background:var(--cream);color:var(--gr)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px var(--greige);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--gr);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(49,64,46,.86);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 18px 36px -10px rgba(25,32,23,.65),inset 0 0 0 1px rgba(181,176,161,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:#e7d9b8}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:var(--brick);color:#fff;margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(165,69,69,.7);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--gr);box-shadow:0 4px 14px -4px rgba(34,45,32,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:16px;position:relative;overflow:hidden;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:600;font-size:42px;letter-spacing:-.02em;line-height:1}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-family:var(--c);font-weight:500}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--f);font-style:italic;font-weight:500;font-size:17px}
.mq div{display:inline-block;animation:mq 32s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold)}.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.orn:after{background:linear-gradient(90deg,var(--gold),transparent)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:28px 28px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(25,32,23,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none;border-top:2px solid var(--gold)}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--greige);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(25,32,23,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--greige);font-size:22px;font-weight:500;display:grid;place-items:center;color:var(--gr)}
.stepper b{font-family:var(--f);font-size:28px;font-weight:600;min-width:34px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:18px;font-size:14.5px;line-height:1.5;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(34,45,32,.5)}
.msg.out{background:var(--gr);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--brick);color:#fff}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--gr);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--gr);color:#fff;box-shadow:0 0 0 1.5px var(--greige)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:104px;height:104px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.28)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c}
.keybtn svg.rg{position:absolute;inset:-12px;width:128px;height:128px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--greige);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--gr);color:#e7d9b8;box-shadow:none}
.seg{display:flex;background:#EAE3CF;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.04em;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--gr);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(61,61,61,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.tick{background:linear-gradient(160deg,#fffdf6,#f1ead4);border-radius:24px;position:relative;box-shadow:0 22px 40px -20px rgba(34,45,32,.6),0 0 0 1px var(--gold)}
.tick:before{content:"";position:absolute;inset:6px;border-radius:19px;border:1px dashed var(--greige);pointer-events:none}
.tickhead{background:var(--gr);color:#fff;border-radius:24px 24px 0 0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.perf{position:relative;height:0;border-top:2px dashed var(--greige);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.hs{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--brick);display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.hs:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:pl 2s infinite}
.hs[aria-pressed=true]{background:var(--brick);color:#fff}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--greige))}
.tl .it{position:relative;margin-bottom:16px}
.tl .it:before{content:"";position:absolute;left:-26px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--brick)}
.stamp{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;text-align:center;border:2px dashed var(--greige);color:var(--greige);transition:all .4s cubic-bezier(.3,1.6,.5,1);flex:none;position:relative}
.stamp.on{border:3px solid var(--brick);color:var(--brick);transform:rotate(-8deg);background:rgba(165,69,69,.06);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--brick)}
.map{background:#EADFC2;background-image:radial-gradient(circle at 20% 15%,rgba(133,113,77,.12),transparent 40%),radial-gradient(circle at 80% 85%,rgba(133,113,77,.14),transparent 40%)}
.dash{stroke-dasharray:7 7}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dr 2.2s .4s forwards ease-out}
@keyframes dr{to{stroke-dashoffset:0}}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}

var NOTES={
welcome:["Arrival","Welcome","The group's own promise, 'Where History meets Belgian Hospitality', over the neo-Gothic monastery in the spring.",["A slow drift over the real photograph of the Monasterium courtyard.","The guest opens the stay from the confirmation e-mail, or picks any of the six hotels.","The logo, the forest green, brick red and gold are the website's own."],"Six hotels in three cities share one idea: a building with a story. The first screen should say it."],
home:["Arrival","Today & key","A Friday arrival at Monasterium Poortackere on a two-night stay, as a heritage ticket. Hold the red button to unlock.",["Hold to unlock the door (illustrative); the ticket shows the room, the dates and the hotel.","Real: parking on site at all hotels except the Ghent River Hotel (public parking 100 m away); Wi-Fi is free; each room has a minibar, tea and coffee.","The pill at the top is a Live Activity for the canal boat tour (tap it)."],"A guest in an old building often does not know where the lift, the garden or the parking is. The app is the doorman."],
room:["Arrival","Your room","A Deluxe Room with Garden View at Monasterium: modern, stylishly refurbished, with an en-suite shower and air conditioning.",["Real: queen-size or twin beds, air conditioning, electronic safe, hair dryer, bathroom amenities, coffee and tea, minibar, free Wi-Fi and a flat-screen TV.","The four room types of the monastery: Standard Twin, Standard Premium, Deluxe (with or without garden view) and Classic. Standard rooms have no air conditioning.","Each room is individually decorated; photos are illustrative, as the hotel says."],"The room list on the website is a list. In the app it is an upgrade the guest can request while standing in the room."],
story:["The building","Story of the building","Tap the glowing dots on the neo-Gothic chapel to read what the hotel says about its building, then scroll through the group's eras.",["Real: a neo-Gothic monastery built in the second half of the 19th century, with lots of wood, high ceilings, peaceful hallways, a courtyard garden and a chapel.","The timeline covers the group's buildings: an 18th-century mansion, a 19th-century patrician house, a monastery and a historic factory on the River Lys.","The River Hotel's building date is shown as 1518 on one page and as 18th century on another, so the timeline avoids a year; the hotel should confirm."],"The buildings are the product. Giving each one a small guided tour turns a night's stay into a story the guest repeats."],
hotels:["The building","Six historic hotels","The whole group in one switcher: four in Ghent, one in Aalst and the Stay@Brussels apartments.",["Real descriptions, star ratings and room types for each hotel: Gravensteen (49 rooms and suites), Ghent River Hotel, Hotel de Flandre, Monasterium, Tower Hotel Aalst and the serviced studios and apartments of Stay@Brussels.","Tap a hotel to see its rooms and what it offers; the group address and phone number come from the contact page.","A guest who loved one building is one tap from the next."],"A group of six needs one guest relationship, not six. The app is that relationship."],
walk:["Ghent","Walk through time","An old-map style route from the hotel through Ghent's historic centre, with the places the hotel names.",["Real places from the hotel's Ghent guide: Gravensteen Castle, Graslei and Korenlei, Saint Bavo's Cathedral and the Ghent Altarpiece, the Belfry, Patershol, the STAM museum and the Vrijdagmarkt.","Tap a stop and save it; saved stops drop into your stay.","The map is schematic and not to scale; walking times are illustrative."],"The hotels are all in the old centre. A walk that starts at the door is the best shop window they have."],
taste:["Ghent","Taste & passport","The foods and drinks the hotel recommends, and a stamp passport that guests can fill during the stay.",["Real list: moules-frites, Belgian waffles, the Vrijdagmarkt and the Sunday flower market, craft beer, chocolate shops and artisan cheese, food tours and Michelin-starred restaurants.","The passport is a concept feature: tick off what you tried and collect a stamp.","No restaurant partnerships are claimed."],"A passport turns a food guide into a reason to stay out, and gives the hotel a way to say 'tell us what you liked'."],
culture:["Ghent","Art & culture","The city's museums, theatres and festivals from the hotel's own guide.",["Real: the Museum of Fine Arts (MSK), Design Museum Ghent, NTGent and the opera, the STAM and SMAK museums, a bike route past public art, the Gentse Feesten and the Ghent film festival.","Highlight: the Ghent Altarpiece, Adoration of the Mystic Lamb, in Saint Bavo's Cathedral.","Each card can be saved to the stay."],"Culture visitors are the guests most likely to book a second night. The guide should be as good as the building."],
family:["Ghent","Family adventures","Monasterium describes itself as a family-run hotel with spacious family rooms. This screen builds a family day from its own list.",["Real: spacious family rooms in the historic monastery, parking on site, and sights within walking distance: Gravensteen Castle, canal boat tours (leaving close to the hotel), the STAM museum and a stroll along the Graslei and Korenlei.","Pick three activities and add them to the plan.","The tone follows the hotel's own copy."],"Families choose a hotel for the logistics. The app shows that the logistics are covered."],
meet:["More","Meetings & events","Meeting rooms for 5 to 250 people in Ghent and Aalst, in churches, gardens and a crypt.",["Real venues: the Monasterium with its own church and garden, Hotel de Flandre's garden meeting room, Hotel Gravensteen's mansion house, the Ghent River Hotel with rooftop terrace and crypt, and the Tower Hotel Aalst.","Latest technology, natural daylight, parking on site or nearby, and corporate rates on request.","A quote request goes to reservations@historichotelsbelgium.com."],"A neo-Gothic church for a meeting is rare. A quote button turns admiration into an enquiry."],
chat:["More","Concierge chat","An answer bot built on the hotels' own pages, with the reservations team behind it.",["Try 'parking', 'air conditioning', 'wifi', 'family', 'meeting', 'Brussels' or 'Ghent River'.","Answers follow what the websites say; anything else goes to +32 92 25 00 00.","The tone stays warm and brief."],"The same questions arrive by phone and email. The app answers in a second and leaves the team time for guests."],
checkout:["More","Check-out","The folio, a thank-you and a way to book direct again.",["The room rate and the times are placeholders; the group does not publish rates on its site.","Real: corporate rates for regular visitors, and a discount when booking directly.","Tap to book the next stay at any of the six hotels."],"A clear folio ends the stay well, and a next-stay prompt starts the next booking."]};

(b.k==="late"?'':'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div><div class="h3">Guests</div><div class="m">'+a.label+'</div></div><div class="stepper"><button data-bg="-1">−</button><b>'+b.g+'</b><button data-bg="1">+</button></div></div>')+

else{S.plan.push({k:"boat"+b.day+b.time,d:b.day,m:mins(b.time),t:b.time,title:"Canal boat tour",sub:b.g+" guests · departs near the hotel",st:"ok"});S.fio.push({t:"Canal boat tour × "+b.g,p:null,s:"at the pier"})}
closeSheet();say(b.k==="late"?"Request sent":"Booked: canal boat tour");

if(t=e.target.closest("[data-fam]")){var fi=+t.dataset.fam;if(S.fam[fi])delete S.fam[fi];else S.fam[fi]=1;var y6=$('[data-v="family"] .scroll').scrollTop;render("family");$('[data-v="family"] .scroll').scrollTop=y6;return}

if(t=e.target.closest("[data-mv]")){quoteSheet(+t.dataset.mv);return}

if(t=e.target.closest("[data-qv]")){$$("[data-qv]").forEach(function(c){c.setAttribute("aria-pressed",c===t?"true":"false")});return}
if(t=e.target.closest("[data-qn]")){var q=$("#qn");q.textContent=Math.max(5,Math.min(250,(+q.textContent)+(+t.dataset.qn)));return}
